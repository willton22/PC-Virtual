name: Virtual Machine
on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Defina uma senha para o usuário'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Instalar Servidor de Área de Trabalho LEVE
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends xfce4 xfce4-terminal xrdp dbus-x11
          echo "xfce4-session" > ~/.xsession
          sudo sed -i 's/port=3389/port=3389\naddress=0.0.0.0/' /etc/xrdp/xrdp.ini
          sudo service xrdp restart

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=pc-virtual --ssh

      - name: Manter PC Ligado
        run: |
          echo "=========================================="
          echo "PC VIRTUAL CRIADO COM SUCESSO!"
          echo "IP: $(tailscale ip -4)"
          echo "Usuario: runner"
          echo "Senha: ${{ github.event.inputs.access_password }}"
          echo "=========================================="
          while true; do sleep 60; echo "PC online $(date)"; done
