name: Virtual Machine
on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Senha do PC'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          echo "runner:${{ inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Instalar Desktop SEM SNAP (ultra rápido)
        run: |
          sudo systemctl stop snapd snapd.socket snapd.seeded || true
          sudo apt-mark hold snapd || true
          sudo apt update
          sudo apt install -y --no-install-recommends xfce4 xfce4-terminal xrdp dbus-x11
          echo "xfce4-session" > ~/.xsession
          sudo sed -i 's/3389/3389\naddress=0.0.0.0/' /etc/xrdp/xrdp.ini || true
          sudo service xrdp restart
          echo "Desktop instalado sem snap!"

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=pc-virtual --ssh

      - name: Manter PC Ligado
        run: |
          echo "=========================================="
          echo "PC VIRTUAL PRONTO!"
          echo "IP Tailscale: $(tailscale ip -4)"
          echo "Usuario: runner"
          echo "Senha: ${{ inputs.access_password }}"
          echo "Baixe o Microsoft Remote Desktop e conecte"
          echo "=========================================="
          while true; do sleep 60; echo "ONLINE $(date)"; done
